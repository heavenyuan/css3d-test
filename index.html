<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>無標題文件</title>
		<style>
			.wrapper {
				position: relative;
				padding: 10px;
				box-sizing: padding-box;
				perspective: 1000px;
				height: 500px;
			}
			.big {
				position: absolute;
				left: 30%;
				top: 40%;
				width: 600px;
				height: 150px;
				transition: transform 1s;
				transform-style: preserve-3d;
				cursor: pointer;
			}
			.cat1,
			.cat2 {
				position: absolute;
				width: 600px;
				height: 150px;
				transition: all 1s;
			}
			.cat1 {
				background-color: #f00;
				transform: translateZ(75px);
			}
			.cat2 {
				background-color: #0f0;
				transform: rotateX(-90deg) translateZ(75px);
			}
			.big:hover {
				transform: translateZ(-75px) rotateX(95deg);
			}
		</style>
	</head>

	<body>
		<div class="wrapper">
			<div class="big">
				<div class="cat1"></div>
				<div class="cat2"></div>
			</div>
		</div>
	</body>
</html>
