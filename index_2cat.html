<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>無標題文件</title>
		<style>
			html {
				padding: 10px;
				box-sizing: padding-box;
				perspective: 1600px;
			}
			.big {
				margin: 0 auto;
				display: table;
				position: absolute;
				left: 50%;
				top: 50%;
				width: 200px;
				height: 250px;
				transition: transform 1s;
				backface-visibility: hidden;
				background: url(cat.png) no-repeat;
				background-position: 50% 50%;
				background-size: 100% auto;
				cursor: pointer;
			}
			.cat2 {
				background-image: url(cat2.png);
			}
		</style>
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				var a = 180;
				var elementData = new WeakMap();
				var blocks = document.querySelectorAll(".big");

				blocks.forEach(function (element, index) {
					var r = a * index;
					element.style.transform = "rotateY(" + r + "deg)";
					elementData.set(element, { r: r });

					element.addEventListener("click", function (e) {
						blocks.forEach(function (el) {
							var data = elementData.get(el);
							var xr = data.r + a;
							el.style.transform = "rotateY(" + xr + "deg)";
							data.r = xr;
						});
					});
				});
			});
		</script>
	</head>

	<body>
		<div class="big cat1"></div>
		<div class="big cat2"></div>
	</body>
</html>
